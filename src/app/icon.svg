<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#00e07a"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Subtle green border -->
  <rect x="4" y="4" width="504" height="504" rx="92" fill="none" stroke="#00ff8830" stroke-width="4"/>
  <!-- All three elements centered on the same baseline -->
  <!-- Terminal prompt chevron > -->
  <text x="100" y="320" font-family="monospace, 'Courier New', sans-serif" font-size="140" font-weight="bold" fill="#00ff88" opacity="0.25" text-anchor="middle">&gt;</text>
  <!-- Alpha symbol α -->
  <text x="256" y="340" font-family="monospace, 'Courier New', sans-serif" font-size="280" font-weight="bold" fill="url(#glow)" text-anchor="middle">α</text>
  <!-- Terminal cursor line | -->
  <rect x="394" y="172" width="22" height="168" rx="4" fill="#00ff88" opacity="0.4"/>
</svg>
